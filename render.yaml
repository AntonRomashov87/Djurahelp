services:
  - type: web
    name: dzhura-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIREBASE_SA_JSON
        sync: false
      - key: PULT_PASSWORD
        sync: false
      - key: TRACKER_PASSWORD
        sync: false
      - key: CALENDAR_ID
        sync: false
      - key: HOME_KEY
        sync: false
